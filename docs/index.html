<style>
  :root {
    --bg: #000;
    --text: #f2ead5;      /* the warm off-white used for every label in the film */
    --muted: rgba(242, 234, 213, 0.62);
    --line: rgba(242, 234, 213, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Antonio", "Arial Narrow", sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 1280px; padding: 48px 16px 64px; }
  h1 {
    margin: 0 0 28px; text-align: center; font-weight: 600;
    font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.04em; line-height: 1.05;
  }
  h1 span { display: block; color: var(--muted); font-weight: 400; font-size: 0.55em; letter-spacing: 0.3em; margin-bottom: 0.35em; }
  .frame { position: relative; width: 100%; aspect-ratio: 2 / 1; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .status {
    margin: 40px 0 0; text-align: center;
    font-size: clamp(20px, 3.4vw, 34px); letter-spacing: 0.16em; font-weight: 600;
  }
  .links { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; }
  a {
    color: var(--text); text-decoration: none;
    font-size: clamp(17px, 2.6vw, 24px); letter-spacing: 0.08em;
    border-bottom: 1px solid var(--line); padding-bottom: 2px;
  }
  a:hover, a:focus-visible { border-bottom-color: var(--text); outline: none; }
  a.quiet { color: var(--muted); font-size: clamp(14px, 2vw, 17px); }
  footer { margin-top: auto; padding: 24px 16px 32px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-align: center; }
</style>
